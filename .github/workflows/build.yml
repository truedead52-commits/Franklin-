name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -oq "$(ls -t *.zip | head -1)"
          cp -r franklin-apk/www ./www
          cp franklin-apk/package.json franklin-apk/capacitor.config.json .
          mkdir -p ~/.android
          cp franklin-apk/debug.keystore ~/.android/debug.keystore
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: franklin-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
